<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Bestämda Artiklar Bros</title><style>
:root{--sky:#66c5f2;--ink:#243047;--gold:#ffd452;--green:#2caa58;--red:#e84b45}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;color:var(--ink);background:linear-gradient(#65c5f4,#c4edff 78%,#75c951 78%,#46a744 82%,#b77742 82%);min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:18px 14px 55px}header{background:#fffef0;border:4px solid #283c4b;border-radius:19px;box-shadow:0 7px #283c4b;padding:16px 22px;text-align:center}h1{margin:0;font-size:clamp(1.6rem,5vw,3rem);color:#dc463b;text-shadow:2px 2px #ffe68c}header p{margin:7px 0}.world{margin:20px 0 8px;font-weight:900;font-size:1.1rem}.levels{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.level{cursor:pointer;background:#fff9e7;border:3px solid #283c4b;border-radius:13px;min-height:90px;padding:9px 4px;box-shadow:0 5px #283c4b;text-align:center;font-weight:800}.level span{display:block;font-size:1.65rem}.level small{display:block;font-size:.72rem;margin-top:4px}.level:disabled{opacity:.48;cursor:not-allowed}.level.active{background:#ffda64}.level.done{background:#b5efae}.panel{background:#fffdf5;border:4px solid #283c4b;box-shadow:0 8px #283c4b;border-radius:20px;padding:clamp(17px,4vw,35px);margin-top:14px;min-height:330px}.tag{font-size:.78rem;font-weight:900;color:#8b5b2b;letter-spacing:.08em;text-transform:uppercase}.panel h2{font-size:clamp(1.5rem,4vw,2.2rem);margin:8px 0 15px}.rule{background:#fff0b9;border:2px solid #d9a448;padding:17px;border-radius:13px;font-size:1.13rem;line-height:1.6}.examples{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin:18px 0}.example{background:#e9f6ff;border:2px solid #a1d1ed;padding:13px;border-radius:12px;text-align:center}.example b{display:block;font-size:1.3rem}.example small{display:block;color:#536b7a}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}button.action{border:3px solid #283c4b;background:#ffd452;border-radius:12px;padding:12px 20px;font-weight:900;font-size:1rem;cursor:pointer;box-shadow:0 4px #283c4b}button.action.green{background:#86e29a}button.action.secondary{background:#e8f2ff}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;max-width:600px;margin:20px auto}.option{font-size:1.3rem;font-weight:900;padding:18px;border-radius:12px;background:#e9f6ff;border:3px solid #34536c;cursor:pointer}.option:disabled{cursor:default}.option.right{background:#9ce4aa}.option.wrong{background:#ffaaa5}.question{text-align:center;font-size:clamp(1.5rem,4vw,2.5rem);font-weight:900;margin:25px 0 7px}.meaning{text-align:center;color:#52657b}.feedback{margin:14px auto;padding:14px;border-radius:10px;max-width:650px;background:#eaf4fd;line-height:1.5;font-weight:650}.feedback.ok{background:#d7f6d9}.feedback.bad{background:#ffe0d9}.meter{height:14px;border:2px solid #304356;background:#dbe4e9;border-radius:20px;overflow:hidden;margin:13px 0}.meter>div{height:100%;background:#43b965;transition:width .2s}.hint{margin-top:12px;color:#556679;font-size:.9rem}.finish{text-align:center;font-size:1.2rem}.footer{text-align:center;margin-top:30px;font-weight:700;font-size:.8rem;color:#203c2c}@media(max-width:700px){.levels{grid-template-columns:repeat(3,1fr)}.level{min-height:76px}.options{grid-template-columns:1fr 1fr}.option{padding:13px}.panel{padding:16px}}
 .write-answer{display:block;margin:18px auto;width:min(100%,390px);font-size:1.6rem;text-align:center;padding:15px;border:3px solid #34536c;border-radius:12px;background:#fff}.write-answer:focus{outline:4px solid #ffd452}.map-intro{margin-top:24px;font-weight:900;font-size:1.2rem}.panel{scroll-margin-top:10px}.level{min-height:82px}@media(max-width:700px){header{padding:10px}header p{font-size:.85rem}.panel{margin-top:10px}.question{margin:12px 0 5px}.world{margin-top:15px}} .topnav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:12px}.topnav .action{font-size:.88rem;padding:9px 13px}.topnav .reset{background:#fff1ee;border-color:#8e3939;color:#8e3939}
</style></head><body><div class="wrap"><header><h1>🍄 SUPER BESTÄMDA ARTIKLAR BROS ⭐</h1><p>Lär dig italienskans bestämda artiklar – en regel i taget!</p><div id="status"></div></header><nav id="nav" class="topnav"></nav><main id="app" class="panel"></main><div id="map"></div><div class="footer">Allt sparas bara i den här webbläsaren · Ingen inloggning behövs</div></div><script>
const words=[

['bambini','barnen (pojkar)','i','mp'],['telefoni','telefonerna','i','mp'],['quaderni','skrivhäftena','i','mp'],['gelati','glassarna','i','mp'],['cappelli','hattarna','i','mp'],['treni','tågen','i','mp'],['letti','sängarna','i','mp'],['piatti','tallrikarna','i','mp'],['giardini','trädgårdarna','i','mp'],['cavalli','hästarna','i','mp'],
['bambine','barnen (flickor)','le','fp'],['penne','pennorna','le','fp'],['porte','dörrarna','le','fp'],['finestre','fönstren','le','fp'],['sedie','stolarna','le','fp'],['borse','väskorna','le','fp'],['macchine','bilarna','le','fp'],['strade','vägarna','le','fp'],['banane','bananerna','le','fp'],['mele','äpplena','le','fp'],
['zio','morbrorn/farbrorn','lo','sp'],['zero','nollan','lo','sp'],['specchio','spegeln','lo','sp'],['spazzolino','tandborsten','lo','sp'],['stadio','stadion','lo','sp'],['squalo','hajen','lo','sp'],['sciatore','skidåkaren','lo','sp'],
['zii','morbröderna/farbröderna','gli','gp'],['specchi','speglarna','gli','gp'],['spazzolini','tandborstarna','gli','gp'],['stadi','stadionerna','gli','gp'],['squali','hajarna','gli','gp'],['sciatori','skidåkarna','gli','gp'],

const pick=(arts,extra=()=>true)=>words.filter(w=>arts.includes(w[2])&&extra(w)).map(w=>w[0]);
const m=pick(['il'],w=>w[0].endsWith('o')), f=pick(['la'],w=>w[0].endsWith('a'));
const im=pick(['i'],w=>w[0].endsWith('i')), lf=pick(['le'],w=>w[0].endsWith('e'));
const vowels=pick(['l’']), specials=pick(['lo']), gli=pick(['gli']);
const basic=[...m,...f], plurals=[...im,...lf];
const levels=[
{title:'Känn igen -o',rule:'Många maskulina ord slutar på <b>-o</b>. Leta efter sista bokstaven. Här finns bara tydliga ord utan undantag.',examples:['libro','gatto','ragazzo'],kind:'gender',pool:basic},
{title:'Känn igen -a',rule:'Många feminina ord slutar på <b>-a</b>. Titta på sista bokstaven. Vi använder bara enkla ord.',examples:['casa','pizza','ragazza'],kind:'gender',pool:basic},
{title:'IL – första artikeln',rule:'Framför vanliga maskulina ord som slutar på <b>-o</b> skriver vi <b>il</b>: <b>il libro</b>. Välj mellan IL och LA.',examples:['libro','gatto','ragazzo'],kind:'article',pool:basic,options:['il','la']},
{title:'LA – andra artikeln',rule:'Framför feminina ord som slutar på <b>-a</b> skriver vi <b>la</b>: <b>la casa</b>. Välj mellan LA och IL.',examples:['casa','pizza','ragazza'],kind:'article',pool:basic,options:['il','la']},
{title:'IL eller LA – repetera',rule:'Titta på slutet: <b>-o → il</b> och <b>-a → la</b>. Bara vanliga, regelbundna ord.',examples:['libro','casa','gatto','pizza'],kind:'article',pool:basic,options:['il','la']},
{title:'Skriv IL eller LA',rule:'Nu skriver du själv <b>il</b> eller <b>la</b>. Titta på -o eller -a. Inga undantag.',examples:['libro','casa','gatto','pizza'],kind:'write',isWriting:true,pool:basic,options:['il','la']},
{title:'IL eller LA – nya ord',rule:'Samma regel med fler ord. <b>-o → il</b>, <b>-a → la</b>. Inga specialfall.',examples:['bambino','penna','telefono','sedia'],kind:'article',pool:basic,options:['il','la']},
{title:'Skriv IL eller LA igen',rule:'Repetera genom att skriva artikeln. Du kan använda hjälpknappen.',examples:['bambino','penna','telefono','sedia'],kind:'write',isWriting:true,pool:basic,options:['il','la']},
{title:'L’ framför vokal',rule:'Börjar ordet på <b>a, e, i, o eller u</b> använder vi <b>l’</b> i singular. Exempel: <b>l’amico</b>. Välj mellan L’ och IL.',examples:['amico','albero','orologio'],kind:'article',pool:[...vowels,...m],options:['l’','il']},
{title:'L’ eller LA',rule:'Även feminina ord får <b>l’</b> framför vokal: <b>l’amica</b>. Jämför <b>l’amica</b> och <b>la casa</b>.',examples:['amica','isola','casa'],kind:'article',pool:[...vowels,...f],options:['l’','la']},
{title:'Skriv L’ eller LA',rule:'Skriv <b>l’</b> framför vokal och <b>la</b> framför vanliga feminina ord med konsonant.',examples:['amica','isola','casa'],kind:'write',isWriting:true,pool:[...pick(['l’'],w=>w[3]==='fv'),...f],options:['l’','la']},
{title:'IL, LA eller L’ – lugn repetition',rule:'Vi repeterar singular. Varje fråga har bara <b>två val</b>. Kontrollera om ordet börjar på vokal.',examples:['libro','casa','amico'],kind:'article',pool:[...basic,...vowels],options:['il','la','l’']},
{title:'LO vid s + konsonant',rule:'Nytt: maskulina ord som börjar på <b>s + konsonant</b> får <b>lo</b>: <b>lo studente</b>. Jämför med <b>il libro</b>.',examples:['studente','specchio','libro'],kind:'article',pool:[...pick(['lo'],w=>/^s[^aeiou]/.test(w[0])),...m],options:['lo','il']},
{title:'LO vid z',rule:'Maskulina ord som börjar på <b>z</b> får också <b>lo</b>: <b>lo zaino</b>. Jämför med <b>il gatto</b>.',examples:['zaino','zio','gatto'],kind:'article',pool:[...pick(['lo'],w=>w[0].startsWith('z')),...m],options:['lo','il']},
{title:'Skriv LO eller IL',rule:'Skriv <b>lo</b> vid s + konsonant eller z, annars <b>il</b> för våra vanliga maskulina ord.',examples:['studente','zaino','libro'],kind:'write',isWriting:true,pool:[...pick(['lo'],w=>/^s[^aeiou]/.test(w[0])||w[0].startsWith('z')),...m],options:['lo','il']},
{title:'Singular – repetition',rule:'Nu känner du <b>il, la, l’ och lo</b>. Du får fortfarande bara två svarsalternativ per fråga.',examples:['libro','casa','amico','studente'],kind:'article',pool:[...basic,...vowels,...specials],options:['il','la','l’','lo']},
{title:'I – plural av IL',rule:'Flera maskulina ord: <b>il libro → i libri</b>. Ofta ändras <b>-o till -i</b>. Jämför med singular IL.',examples:['libro','libri','gatto','gatti'],kind:'article',pool:[...m,...im],options:['il','i']},
{title:'LE – plural av LA',rule:'Flera feminina ord: <b>la casa → le case</b>. Ofta ändras <b>-a till -e</b>. Jämför LA och LE.',examples:['casa','case','pizza','ragazze'],kind:'article',pool:[...f,...lf],options:['la','le']},
{title:'I eller LE',rule:'Bara plural: maskulin plural får ofta <b>i</b> och feminin plural <b>le</b>.',examples:['libri','case','gatti','ragazze'],kind:'article',pool:plurals,options:['i','le']},
{title:'Skriv I eller LE',rule:'Skriv själv <b>i</b> eller <b>le</b> framför pluralorden.',examples:['libri','case','gatti','ragazze'],kind:'write',isWriting:true,pool:plurals,options:['i','le']},
{title:'GLI – plural av LO',rule:'<b>lo studente → gli studenti</b>. Vi börjar med att skilja LO i singular från GLI i plural.',examples:['studente','studenti','zaino','zaini'],kind:'article',pool:[...specials,...gli],options:['lo','gli']},
{title:'GLI eller I',rule:'I plural blir <b>lo → gli</b>, men <b>il → i</b>. Jämför <b>gli studenti</b> och <b>i libri</b>.',examples:['studenti','libri','zaini','gatti'],kind:'article',pool:[...gli,...im],options:['gli','i']},

{title:'Slutboss – välj artikel',rule:'Nu blandas alla artiklar, men du får fortfarande <b>bara två val</b> åt gången. Använd hjälp om du vill.',examples:['libro','casa','amico','studenti'],kind:'article',pool:words.map(w=>w[0]),options:['il','la','l’','lo','i','le','gli']},
{title:'Slutboss – skriv själv',rule:'Sista utmaningen: skriv själv artikeln. Du kan repetera hur många gånger du vill med nya ord.',examples:['libro','casa','studente','amici'],kind:'write',isWriting:true,pool:words.map(w=>w[0]),options:['il','la','l’','lo','i','le','gli']}
];
const TOTAL=levels.length;
const key='super_bestamda_artiklar_bros_stegvis_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}

let unlocked=Math.max(0,Math.min(TOTAL-1,Number(saved.unlocked)||0)),done=Array.isArray(saved.done)?saved.done:[],wins=Array.from({length:TOTAL},(_,i)=>Number((saved.wins||[])[i])||0),lastSets=saved.lastSets||{},current=unlocked,phase='learn',questions=[],index=0,score=0,misses=[],answered=false;
const app=document.getElementById('app');
function persist(){try{localStorage.setItem(key,JSON.stringify({unlocked,done,wins,lastSets}))}catch(e){}}
function word(name){return words.find(w=>w[0]===name)}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function ruleFor(w){return ({il:'IL används framför vanliga maskulina singularord som börjar på konsonant.',la:'LA används framför feminina singularord som börjar på konsonant.','l’':'L’ används framför vokal i singular.',lo:'LO används framför vissa maskulina singularord, till exempel s + konsonant och z.',i:'I används i vanlig maskulin plural.',le:'LE används i feminin plural.',gli:'GLI används i maskulin plural för LO-ord och maskulina L’-ord.'})[w[2]]}
function renderMap(){let groups=[['🌱 Värld 1 – IL och LA',0,8],['🍄 Värld 2 – L’ och LO',8,16],['⭐ Värld 3 – Plural och final',16,TOTAL]];document.getElementById('map').innerHTML='<div class="map-intro">🗺️ Välj nivå</div>'+groups.map(([name,a,b])=>`<div class="world">${name}</div><div class="levels">${levels.slice(a,b).map((l,k)=>{let i=a+k;return `<button class="level ${current===i?'active':''} ${done.includes(i)?'done':''}" ${i>unlocked?'disabled':''} onclick="openLevel(${i})"><span>${i>unlocked?'🔒':done.includes(i)?'⭐':l.isWriting?'✏️':'❔'}</span>${i+1}. <small>${esc(l.title)}</small>${wins[i]?`<small>🏆 ${wins[i]} gånger</small>`:''}</button>`}).join('')}</div>`).join('');document.getElementById('status').textContent=`⭐ ${done.length} av ${TOTAL} nivåer klarade · 🏆 ${wins.reduce((a,b)=>a+b,0)} godkända omgångar`}
function goBack(){if(phase==='learn'){openLevel(Math.max(0,current-1))}else{phase='learn';render();window.scrollTo({top:0,behavior:'smooth'})}}
function resetStars(){if(!confirm('Vill du nollställa alla stjärnor och börja om från nivå 1?'))return;unlocked=0;done=[];wins=Array(TOTAL).fill(0);lastSets={};current=0;phase='learn';persist();render();window.scrollTo({top:0,behavior:'smooth'})}
function openLevel(i){if(i>unlocked)return;current=i;phase='learn';render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){app.dataset.stage=String(current+1).padStart(2,"0");renderMap();document.getElementById('nav').innerHTML=`<button class="action secondary" onclick="goBack()">⬅️ Tillbaka</button><button class="action reset" onclick="resetStars()">☆ Nollställ alla stjärnor</button>`;let l=levels[current],tag=`Nivå ${current+1} av ${TOTAL}`;
if(phase==='learn'){app.innerHTML=`<div class="tag">${tag} · ${l.isWriting?'✏️ Skriv själv':'📖 Lär dig regeln'}</div><h2>${esc(l.title)}</h2><div class="rule">${l.rule}</div><div class="examples">${l.examples.map(n=>{let w=word(n);return w?`<div class="example"><b>${esc(w[2])} ${esc(w[0])}</b><small>${esc(w[1])}</small></div>`:''}).join('')}</div><div class="actions"><button class="action green" onclick="start('practice')">🎮 Öva med 3 frågor</button>${done.includes(current)?'<button class="action secondary" onclick="start(\'test\')">🔄 Gör om nivån – nya frågor</button>':''}</div><div class="hint">Först övar du utan krav. Sedan gör du ett nivåtest med fem frågor.</div>`;return}
if(phase==='practice'||phase==='test'){renderQuestion();return}
if(phase==='result'){let passed=score===5;app.innerHTML=`<div class="tag">${tag} · Resultat</div><h2>${passed?'🌟 Nivån klarad!':'🍄 Nästan där!'}</h2><div class="finish"><strong>${score} av 5 rätt</strong><p>${passed?'Bra jobbat! Vill du gå vidare?':'Du behöver 5 av 5 rätt. Träna gärna på orden som var svåra.'}</p></div>${misses.length?`<div class="rule"><b>Repetera dessa ord:</b>${misses.map(w=>`<p><b>${esc(w[2])} ${esc(w[0])}</b> – ${esc(w[1])}. ${ruleFor(w)}</p>`).join('')}</div>`:''}<div class="actions">${passed&&current<TOTAL-1?'<button class="action green" onclick="advance()">➡️ Gå vidare?</button>':''}<button class="action green" onclick="start('test')">🔄 Gör om nivån – nya frågor</button><button class="action" onclick="start('practice')">🔁 Öva igen</button><button class="action secondary" onclick="openLevel(current)">📖 Läs regeln</button></div>`;return}
if(phase==='ready'){app.innerHTML=`<div class="tag">${tag} · Bra jobbat!</div><h2>⭐ Du har övat!</h2><p>Nu kommer fem ${l.isWriting?'skrivfrågor':'frågor'}. Du behöver alla rätt för att låsa upp nästa nivå.</p><div class="actions"><button class="action green" onclick="start('test')">🏁 Starta nivåtest</button><button class="action secondary" onclick="openLevel(current)">📖 Läs regeln igen</button></div>`}}
function start(type){phase=type;index=0;score=0;misses=[];answered=false;let l=levels[current],pool=l.pool.map(word).filter(Boolean),count=type==='practice'?3:5;let previous=new Set(lastSets[current]||[]);let fresh=shuffle(pool.filter(w=>!previous.has(w[0]))),remaining=shuffle(pool.filter(w=>previous.has(w[0])));questions=[...fresh,...remaining].slice(0,count);if(type==='test'){lastSets[current]=questions.map(w=>w[0]);persist()}render();window.scrollTo({top:0,behavior:'smooth'})}
function correct(w){return levels[current].kind==='gender'?(w[3]==='m'||w[3]==='mv'||w[3]==='sp'||w[3]==='mp'||w[3]==='gp'?'Maskulinum':'Femininum'):w[2]}
function choices(w){let l=levels[current],opts=l.kind==='gender'?['Maskulinum','Femininum']:(l.options||['il','la']),c=correct(w);if(!opts.includes(c))opts=[...opts,c];if(opts.length>2){let wrong=opts.filter(o=>o!==c);opts=[c,wrong[Math.floor(Math.random()*wrong.length)]]}return shuffle(opts)}
function renderQuestion(){let w=questions[index],l=levels[current];answered=false;let write=l.isWriting;app.innerHTML=`<div class="tag">Nivå ${current+1} · ${phase==='practice'?'Övning':'Nivåtest'} · Fråga ${index+1} av ${questions.length}</div><div class="meter"><div style="width:${100*index/questions.length}%"></div></div><h2 style="text-align:center">${write?'Skriv den bestämda artikeln':l.kind==='gender'?'Maskulinum eller femininum?':'Vilken bestämd artikel passar?'}</h2><div class="question">${l.kind==='gender'?esc(w[0]):'___ '+esc(w[0])}</div><div class="meaning">${esc(w[1])}</div>${write?`<form onsubmit="event.preventDefault();submitWritten()"><input id="writeInput" class="write-answer" type="text" placeholder="Skriv t.ex. la" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Skriv artikeln"><div class="actions" style="justify-content:center"><button id="check" class="action green" type="submit">✔️ Rätta mitt svar</button></div></form><div class="hint" style="text-align:center">Skriv bara artikeln, inte hela ordet. För l’ fungerar även l'.</div>`:`<div class="options">${choices(w).map(o=>`<button class="option" onclick="choose('${o}')">${esc(o)}</button>`).join('')}</div>`}<div style="text-align:center;margin-top:12px"><button class="action secondary" onclick="showHelp()">💡 Visa hjälp</button></div><div id="help"></div><div id="feedback"></div><div class="actions" style="justify-content:center"><button id="next" class="action green" style="display:none" onclick="nextQuestion()">Nästa ➡️</button></div>`}
function showHelp(){document.getElementById('help').innerHTML=`<div class="feedback">💡 ${levels[current].rule}</div>`}
function normalize(v){return String(v).trim().toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g,'')}
function submitWritten(){if(answered)return;let el=document.getElementById('writeInput');let v=el.value.trim();if(!v){el.focus();return}choose(v)}
function choose(v){if(answered)return;answered=true;let w=questions[index],c=correct(w),ok=normalize(v)===normalize(c);if(ok)score++;else misses.push(w);document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.textContent===c)b.classList.add('right');else if(b.textContent===v)b.classList.add('wrong')});let input=document.getElementById('writeInput');if(input){input.disabled=true;document.getElementById('check').disabled=true;input.style.background=ok?'#d7f6d9':'#ffe0d9'}let fb=document.getElementById('feedback');fb.className='feedback '+(ok?'ok':'bad');fb.innerHTML=`<b>${ok?'✅ Rätt!':'❌ Inte riktigt.'}</b> ${levels[current].kind==='gender'?`<b>${esc(w[0])}</b> är ${c.toLowerCase()}. ${w[0].endsWith('o')?'Ordet slutar på -o, vilket ofta visar maskulinum.':w[0].endsWith('a')?'Ordet slutar på -a, vilket ofta visar femininum.':'Lär dig ordets genus tillsammans med artikeln.'}`:`Rätt svar är <b>${esc(c)} ${esc(w[0])}</b>. ${ruleFor(w)}`}`;document.getElementById('next').style.display='inline-block'}
function nextQuestion(){index++;answered=false;if(index<questions.length){renderQuestion();return}if(phase==='practice'){phase='ready'}else{phase='result';if(score===5){wins[current]=(wins[current]||0)+1;if(!done.includes(current))done.push(current);unlocked=Math.max(unlocked,Math.min(TOTAL-1,current+1));persist()}}render();window.scrollTo({top:0,behavior:'smooth'})}
function advance(){openLevel(Math.min(TOTAL-1,current+1))}render();
</script></body></html>

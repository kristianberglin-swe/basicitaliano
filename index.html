:root{--sky:#66c5f2;--ink:#243047;--gold:#ffd452;--green:#2caa58;--red:#e84b45}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;color:var(--ink);background:linear-gradient(#65c5f4,#c4edff 78%,#75c951 78%,#46a744 82%,#b77742 82%);min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:18px 14px 55px}header{background:#fffef0;border:4px solid #283c4b;border-radius:19px;box-shadow:0 7px #283c4b;padding:16px 22px;text-align:center}h1{margin:0;font-size:clamp(1.6rem,5vw,3rem);color:#dc463b;text-shadow:2px 2px #ffe68c}header p{margin:7px 0}.world{margin:20px 0 8px;font-weight:900;font-size:1.1rem}.levels{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.level{cursor:pointer;background:#fff9e7;border:3px solid #283c4b;border-radius:13px;min-height:90px;padding:9px 4px;box-shadow:0 5px #283c4b;text-align:center;font-weight:800}.level span{display:block;font-size:1.65rem}.level small{display:block;font-size:.72rem;margin-top:4px}.level:disabled{opacity:.48;cursor:not-allowed}.level.active{background:#ffda64}.level.done{background:#b5efae}.panel{background:#fffdf5;border:4px solid #283c4b;box-shadow:0 8px #283c4b;border-radius:20px;padding:clamp(17px,4vw,35px);margin-top:24px;min-height:330px}.tag{font-size:.78rem;font-weight:900;color:#8b5b2b;letter-spacing:.08em;text-transform:uppercase}.panel h2{font-size:clamp(1.5rem,4vw,2.2rem);margin:8px 0 15px}.rule{background:#fff0b9;border:2px solid #d9a448;padding:17px;border-radius:13px;font-size:1.13rem;line-height:1.6}.examples{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin:18px 0}.example{background:#e9f6ff;border:2px solid #a1d1ed;padding:13px;border-radius:12px;text-align:center}.example b{display:block;font-size:1.3rem}.example small{display:block;color:#536b7a}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}button.action{border:3px solid #283c4b;background:#ffd452;border-radius:12px;padding:12px 20px;font-weight:900;font-size:1rem;cursor:pointer;box-shadow:0 4px #283c4b}button.action.green{background:#86e29a}button.action.secondary{background:#e8f2ff}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;max-width:600px;margin:20px auto}.option{font-size:1.3rem;font-weight:900;padding:18px;border-radius:12px;background:#e9f6ff;border:3px solid #34536c;cursor:pointer}.option:disabled{cursor:default}.option.right{background:#9ce4aa}.option.wrong{background:#ffaaa5}.question{text-align:center;font-size:clamp(1.5rem,4vw,2.5rem);font-weight:900;margin:25px 0 7px}.meaning{text-align:center;color:#52657b}.feedback{margin:14px auto;padding:14px;border-radius:10px;max-width:650px;background:#eaf4fd;line-height:1.5;font-weight:650}.feedback.ok{background:#d7f6d9}.feedback.bad{background:#ffe0d9}.meter{height:14px;border:2px solid #304356;background:#dbe4e9;border-radius:20px;overflow:hidden;margin:13px 0}.meter>div{height:100%;background:#43b965;transition:width .2s}.hint{margin-top:12px;color:#556679;font-size:.9rem}.finish{text-align:center;font-size:1.2rem}.footer{text-align:center;margin-top:30px;font-weight:700;font-size:.8rem;color:#203c2c}@media(max-width:700px){.levels{grid-template-columns:repeat(3,1fr)}.level{min-height:76px}.options{grid-template-columns:1fr 1fr}.option{padding:13px}.panel{padding:16px}}
</style></head><body><div class="wrap"><header><h1>🍄 SUPER BESTÄMDA ARTIKLAR BROS ⭐</h1><p>Lär dig italienskans bestämda artiklar – en regel i taget!</p><div id="status"></div></header><div id="map"></div><main id="app" class="panel"></main><div class="footer">Allt sparas bara i den här webbläsaren · Ingen inloggning behövs</div></div><script>

const levels=[
{title:'Maskulinum -o',rule:'Många <b>maskulina</b> ord slutar på <b>-o</b>. Exempel: <b>ragazzo</b> och <b>libro</b>. Det är en ledtråd, inte en regel som alltid stämmer. Vi tränar bara tydliga ord på <b>-o</b> och <b>-a</b>. Inga undantag ännu!',examples:['ragazzo','libro','gatto','tavolo'],kind:'gender',pool:['ragazzo','libro','gatto','tavolo','ragazza','casa','scuola','pizza']},
{title:'Femininum -a',rule:'Många <b>feminina</b> ord slutar på <b>-a</b>. Exempel: <b>ragazza</b> och <b>casa</b>. Vi tränar bara tydliga ord på <b>-a</b> och <b>-o</b>. Inga undantag ännu!',examples:['ragazza','casa','scuola','pizza'],kind:'gender',pool:['ragazza','casa','scuola','pizza','ragazzo','libro','gatto','tavolo']},
{title:'IL – maskulinum',rule:'Framför många maskulina ord i singular använder du <b>IL</b>. Exempel: <b>il libro</b>. Det gäller inte alla maskulina ord.',examples:['libro','ragazzo','gatto','tavolo'],kind:'article',pool:['libro','ragazzo','gatto','tavolo']},
{title:'LA – femininum',rule:'Framför feminina ord i singular som börjar på <b>konsonant</b> använder du <b>LA</b>. Exempel: <b>la casa</b>.',examples:['casa','ragazza','scuola','pizza'],kind:'article',pool:['casa','ragazza','scuola','pizza']},
{title:'Miniboss: IL eller LA?',rule:'Nu blandar vi de två första artiklarna. <b>IL</b> används framför vanliga maskulina singularord och <b>LA</b> framför feminina singularord som börjar på konsonant. Titta på ordets genus!',examples:['libro','casa','ragazzo','ragazza'],kind:'article',pool:['libro','ragazzo','gatto','tavolo','casa','ragazza','scuola','pizza'],options:['il','la']},
{title:'L’ – framför vokal',rule:'När ett ord i singular börjar på <b>vokal</b> (a, e, i, o, u) använder man ofta <b>L’</b> i stället för IL eller LA. Det gäller både maskulinum och femininum: <b>l’amico</b>, <b>l’amica</b>.',examples:['amico','amica','albero','isola'],kind:'article',pool:['amico','amica','albero','orologio','isola','acqua','casa','libro'],options:['il','la','l’']},
{title:'LO – specialord',rule:'Vissa maskulina ord i singular får <b>LO</b>, till exempel när ordet börjar på <b>s + konsonant</b>, <b>z</b>, <b>ps</b> eller <b>gn</b>. Exempel: <b>lo studente</b> och <b>lo zaino</b>.',examples:['studente','zaino','psicologo','gnomo'],kind:'article',pool:['studente','zaino','sport','psicologo','gnomo','libro','ragazzo'],options:['il','lo']},
{title:'Miniboss: singular',rule:'Välj mellan <b>IL, LA, L’ och LO</b>. Fundera först på om ordet är maskulint eller feminint. Kontrollera sedan om det börjar på vokal eller en specialkombination.',examples:['ragazzo','casa','amico','studente'],kind:'article',pool:['ragazzo','libro','casa','notte','amico','amica','studente','zaino'],options:['il','la','l’','lo']},
{title:'I – maskulin plural',rule:'I plural blir <b>IL → I</b>. Många maskulina ord som slutar på <b>-o</b> får <b>-i</b> i plural: <b>il libro → i libri</b>. Även <b>il cane → i cani</b>.',examples:['libri','ragazzi','gatti','cani'],kind:'article',pool:['libri','ragazzi','gatti','cani','tavoli','case','ragazze'],options:['i','le']},
{title:'LE – feminin plural',rule:'I plural blir både <b>LA → LE</b> och feminin <b>L’ → LE</b>. Många feminina ord på -a får -e: <b>la casa → le case</b>. Exempel: <b>l’amica → le amiche</b>.',examples:['case','ragazze','scuole','amiche'],kind:'article',pool:['case','ragazze','scuole','amiche','isole','libri','ragazzi'],options:['i','le']},
{title:'GLI – maskulin plural',rule:'I plural blir <b>LO → GLI</b> och maskulin <b>L’ → GLI</b>. Exempel: <b>lo studente → gli studenti</b> och <b>l’amico → gli amici</b>.',examples:['studenti','zaini','amici','alberi'],kind:'article',pool:['studenti','zaini','amici','alberi','psicologi','libri','case'],options:['i','le','gli']},
{title:'Slutboss: allt!',rule:'Nu tränar du alla artiklar: <b>IL, LA, L’, LO, I, LE, GLI</b>. Bestäm först singular eller plural, sedan genus och hur ordet börjar. Du kan använda hjälpknappen när du behöver.',examples:['libro','casa','amico','studenti'],kind:'article',pool:words.map(w=>w[0]),options:['il','la','l’','lo','i','le','gli']}
];

const simpleM=words.filter(w=>w[2]==='il'&&w[0].endsWith('o')).map(w=>w[0]);
const simpleF=words.filter(w=>w[2]==='la'&&w[0].endsWith('a')).map(w=>w[0]);
levels[0].pool=[...simpleM,...simpleF];levels[1].pool=[...simpleF,...simpleM];
levels[2].pool=[...simpleM];levels[3].pool=[...simpleF];levels[4].pool=[...simpleM,...simpleF];
levels[5].pool=words.filter(w=>['il','la','l’'].includes(w[2])).map(w=>w[0]);
levels[6].pool=words.filter(w=>['il','lo'].includes(w[2])).map(w=>w[0]);
levels[7].pool=words.filter(w=>['il','la','l’','lo'].includes(w[2])).map(w=>w[0]);
levels[8].pool=words.filter(w=>['i','le'].includes(w[2])).map(w=>w[0]);
levels[9].pool=words.filter(w=>['i','le'].includes(w[2])).map(w=>w[0]);
levels[10].pool=words.filter(w=>['i','le','gli'].includes(w[2])).map(w=>w[0]);
levels[11].pool=words.map(w=>w[0]);
const key='artikelaventyret_v2';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{}let unlocked=Math.max(0,Math.min(11,Number(saved.unlocked)||0)),done=Array.isArray(saved.done)?saved.done:[],wins=Array.isArray(saved.wins)?saved.wins:Array(12).fill(0),lastSets=saved.lastSets||{},current=unlocked,phase='learn',questions=[],index=0,score=0,misses=[],answered=false,selected='';const app=document.getElementById('app');function persist(){localStorage.setItem(key,JSON.stringify({unlocked,done,wins,lastSets}))}function word(name){return words.find(w=>w[0]===name)}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function ruleFor(w){let a=w[2];return ({il:'IL används framför vanliga maskulina singularord som börjar på konsonant.',la:'LA används framför feminina singularord som börjar på konsonant.','l’':'L’ används framför vokal i singular (både maskulinum och femininum).',lo:'LO används framför vissa maskulina singularord, bland annat s + konsonant, z, ps och gn.',i:'I används i vanlig maskulin plural.',le:'LE används i feminin plural.',gli:'GLI används i maskulin plural för LO-ord och maskulina L’-ord.'})[a]}function renderMap(){let names=['🌱 Värld 1 – Grunderna','🍄 Värld 2 – Specialregler','⭐ Värld 3 – Plural och slutboss'];document.getElementById('map').innerHTML=names.map((n,j)=>`<div class="world">${n}</div><div class="levels">${levels.slice(j===0?0:j===1?5:8,j===0?5:j===1?8:12).map((l,k)=>{let i=k+(j===0?0:j===1?5:8);return `<button class="level ${current===i?'active':''} ${done.includes(i)?'done':''}" ${i>unlocked?'disabled':''} onclick="openLevel(${i})"><span>${i>unlocked?'🔒':done.includes(i)?'⭐':i===4||i===7||i===11?'🏰':'❔'}</span>${i+1}. <small>${esc(l.title)}</small>${wins[i]?`<small>🏆 ${wins[i]} gånger</small>`:''}</button>`}).join('')}</div>`).join('');document.getElementById('status').textContent=`⭐ ${done.length} av 12 nivåer klarade · 🏆 ${wins.reduce((a,b)=>a+b,0)} godkända omgångar`}
function openLevel(i){if(i>unlocked)return;current=i;phase='learn';render()}function render(){renderMap();let l=levels[current];if(phase==='learn'){app.innerHTML=`<div class="tag">Nivå ${current+1} av 12 · Lär dig regeln</div><h2>${esc(l.title)}</h2><div class="rule">${l.rule}</div><div class="examples">${l.examples.map(n=>{let w=word(n);return `<div class="example"><b>${w[2]} ${esc(w[0])}</b><small>${esc(w[1])}</small></div>`}).join('')}</div><div class="actions"><button class="action green" onclick="start('practice')">🎮 Öva med 3 frågor</button>${done.includes(current)?'<button class="action secondary" onclick="start(&#39;test&#39;)">🔄 Gör om nivån – nya frågor</button>':''}</div><div class="hint">Du får först öva utan krav. Sedan gör du ett kort nivåtest.</div>`;return}if(phase==='practice'||phase==='test'){renderQuestion();return}if(phase==='result'){let passed=score===5;app.innerHTML=`<div class="tag">Nivå ${current+1} · Resultat</div><h2>${passed?'🌟 Nivån klarad!':'🍄 Nästan där!'}</h2><div class="finish"><strong>${score} av 5 rätt</strong>${passed?`<p>🏆 Du har klarat nivå ${current+1} ${wins[current]} ${wins[current]===1?'gång':'gånger'}!</p>`:''}<p>${passed?'Du har klarat nivån! Vill du gå vidare?':'För att klara nivån behöver du 5 av 5 rätt. Öva på det som var svårt och prova igen.'}</p></div>${misses.length?`<div class="rule"><b>Det här kan du repetera:</b><div>${misses.map(w=>`<p><b>${w[2]} ${esc(w[0])}</b> – ${esc(w[1])}. ${ruleFor(w)}</p>`).join('')}</div></div>`:''}<div class="actions">${passed&&current<11?'<button class="action green" onclick="advance()">➡️ Gå vidare?</button>':''}<button class="action green" onclick="start('test')">🔄 Gör om nivån – nya frågor</button><button class="action" onclick="start('practice',true)">🔁 Öva igen</button><button class="action secondary" onclick="openLevel(current)">📖 Läs regeln</button></div>`;return}if(phase==='ready'){app.innerHTML=`<div class="tag">Nivå ${current+1} · Bra jobbat!</div><h2>⭐ Du har övat!</h2><p>Nu kommer ett nivåtest med <b>5 frågor</b>. Du behöver alla rätt för att låsa upp nästa nivå. Vid fel får du en förklaring och kan prova igen.</p><div class="actions"><button class="action green" onclick="start('test')">🏁 Starta nivåtest</button><button class="action secondary" onclick="openLevel(current)">📖 Läs regeln igen</button></div>`}}
function start(type,review=false){phase=type;index=0;score=0;misses=[];answered=false;let l=levels[current];let pool=l.pool.map(word).filter(Boolean);let count=type==='practice'?3:5;let previous=new Set(lastSets[current]||[]);let fresh=shuffle(pool.filter(w=>!previous.has(w[0])));let remaining=shuffle(pool.filter(w=>previous.has(w[0])));let chosen=[...fresh,...remaining].slice(0,count);questions=chosen;if(type==='test'){lastSets[current]=chosen.map(w=>w[0]);persist()}render()}
function correct(w){return levels[current].kind==='gender'?(w[3]==='m'||w[3]==='mv'||w[3]==='sp'||w[3]==='mp'||w[3]==='gp'?'Maskulinum':'Femininum'):w[2]}
function choices(w){let l=levels[current];let opts=l.kind==='gender'?['Maskulinum','Femininum']:(l.options||[w[2],'la','lo','l’']);let c=correct(w);if(!opts.includes(c))opts=[...opts,c];return shuffle(opts)}
function renderQuestion(){let w=questions[index],l=levels[current],c=correct(w);let opts=choices(w);app.innerHTML=`<div class="tag">Nivå ${current+1} · ${phase==='practice'?'Övning':'Nivåtest'} · Fråga ${index+1} av ${questions.length}</div><div class="meter"><div style="width:${100*index/questions.length}%"></div></div><h2 style="text-align:center">${l.kind==='gender'?'Är ordet maskulint eller feminint?':'Vilken bestämd artikel passar?'}</h2><div class="question">${l.kind==='gender'?esc(w[0]):'___ '+esc(w[0])}</div><div class="meaning">${esc(w[1])}</div><div class="options">${opts.map(o=>`<button class="option" onclick="choose(${JSON.stringify(o).replaceAll('"','&quot;')})">${esc(o)}</button>`).join('')}</div><div style="text-align:center"><button class="action secondary" onclick="showHelp()">💡 Visa hjälp</button></div><div id="help"></div><div id="feedback"></div><div class="actions" style="justify-content:center"><button id="next" class="action green" style="display:none" onclick="nextQuestion()">Nästa ➡️</button></div>`}
function showHelp(){document.getElementById('help').innerHTML=`<div class="feedback">💡 ${levels[current].rule}</div>`}
function choose(v){if(answered)return;answered=true;let w=questions[index],c=correct(w),ok=v===c;if(ok)score++;else misses.push(w);document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.textContent===c)b.classList.add('right');else if(b.textContent===v)b.classList.add('wrong')});let fb=document.getElementById('feedback');fb.className='feedback '+(ok?'ok':'bad');fb.innerHTML=`<b>${ok?'✅ Rätt!':'❌ Inte riktigt.'}</b> ${levels[current].kind==='gender'?`<b>${esc(w[0])}</b> är ${c.toLowerCase()}. ${w[0].endsWith('o')?'Ordet slutar på -o, vilket ofta visar maskulinum.':w[0].endsWith('a')?'Ordet slutar på -a, vilket ofta visar femininum.':'Ord på -e kan vara maskulina eller feminina. Lär dig dem tillsammans med artikeln.'}`:`Rätt svar är <b>${c} ${esc(w[0])}</b>. ${ruleFor(w)}`}`;document.getElementById('next').style.display='inline-block'}
function nextQuestion(){index++;answered=false;if(index<questions.length){renderQuestion();return}if(phase==='practice'){phase='ready'}else{phase='result';if(score===5){wins[current]=(wins[current]||0)+1;if(!done.includes(current))done.push(current);unlocked=Math.max(unlocked,Math.min(11,current+1));persist()}}render()}
function advance(){openLevel(Math.min(11,current+1))}render();
</script></body></html>

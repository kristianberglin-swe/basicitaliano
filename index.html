const oldToNew=[];levels.length=0;for(let j=0;j<originalLevels.length;j++){oldToNew[j]=levels.length;levels.push(originalLevels[j]);if(writingAfter[j])levels.push({...writingAfter[j],kind:'write',isWriting:true})}

function word(name){return words.find(w=>w[0]===name)}

function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function ruleFor(w){return ({il:'IL används framför vanliga maskulina singularord som börjar på konsonant.',la:'LA används framför feminina singularord som börjar på konsonant.','l’':'L’ används framför vokal i singular.',lo:'LO används framför vissa maskulina singularord, till exempel s + konsonant och z.',i:'I används i vanlig maskulin plural.',le:'LE används i feminin plural.',gli:'GLI används i maskulin plural för LO-ord och maskulina L’-ord.'})[w[2]]}

if(phase==='ready'){app.innerHTML=`<div class="tag">${tag} · Bra jobbat!</div><h2>⭐ Du har övat!</h2><p>Nu kommer fem ${l.isWriting?'skrivfrågor':'frågor'}. Du behöver alla rätt för att låsa upp nästa nivå.</p><div class="actions"><button class="action green" onclick="start('test')">🏁 Starta nivåtest</button><button class="action secondary" onclick="openLevel(current)">📖 Läs regeln igen</button></div>`}}
function start(type){phase=type;index=0;score=0;misses=[];answered=false;let l=levels[current],pool=l.pool.map(word).filter(Boolean),count=type==='practice'?3:5;let previous=new Set(lastSets[current]||[]);let fresh=shuffle(pool.filter(w=>!previous.has(w[0]))),remaining=shuffle(pool.filter(w=>previous.has(w[0])));questions=[...fresh,...remaining].slice(0,count);if(type==='test'){lastSets[current]=questions.map(w=>w[0]);persist()}render();window.scrollTo({top:0,behavior:'smooth'})}
function correct(w){return levels[current].kind==='gender'?(w[3]==='m'||w[3]==='mv'||w[3]==='sp'||w[3]==='mp'||w[3]==='gp'?'Maskulinum':'Femininum'):w[2]}
function choices(w){let l=levels[current],opts=l.kind==='gender'?['Maskulinum','Femininum']:(l.options||['il','la']),c=correct(w);if(!opts.includes(c))opts=[...opts,c];if(opts.length>2){let wrong=opts.filter(o=>o!==c);opts=[c,wrong[Math.floor(Math.random()*wrong.length)]]}return shuffle(opts)}
function renderQuestion(){let w=questions[index],l=levels[current];answered=false;let write=l.isWriting;app.innerHTML=`<div class="tag">Nivå ${current+1} · ${phase==='practice'?'Övning':'Nivåtest'} · Fråga ${index+1} av ${questions.length}</div><div class="meter"><div style="width:${100*index/questions.length}%"></div></div><h2 style="text-align:center">${write?'Skriv den bestämda artikeln':l.kind==='gender'?'Maskulinum eller femininum?':'Vilken bestämd artikel passar?'}</h2><div class="question">${l.kind==='gender'?esc(w[0]):'___ '+esc(w[0])}</div><div class="meaning">${esc(w[1])}</div>${write?`<form onsubmit="event.preventDefault();submitWritten()"><input id="writeInput" class="write-answer" type="text" placeholder="Skriv t.ex. la" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Skriv artikeln"><div class="actions" style="justify-content:center"><button id="check" class="action green" type="submit">✔️ Rätta mitt svar</button></div></form><div class="hint" style="text-align:center">Skriv bara artikeln, inte hela ordet. För l’ fungerar även l'.</div>`:`<div class="options">${choices(w).map(o=>`<button class="option" onclick="choose('${o}')">${esc(o)}</button>`).join('')}</div>`}<div style="text-align:center;margin-top:12px"><button class="action secondary" onclick="showHelp()">💡 Visa hjälp</button></div><div id="help"></div><div id="feedback"></div><div class="actions" style="justify-content:center"><button id="next" class="action green" style="display:none" onclick="nextQuestion()">Nästa ➡️</button></div>`}
function showHelp(){document.getElementById('help').innerHTML=`<div class="feedback">💡 ${levels[current].rule}</div>`}
function normalize(v){return String(v).trim().toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g,'')}
function submitWritten(){if(answered)return;let el=document.getElementById('writeInput');let v=el.value.trim();if(!v){el.focus();return}choose(v)}
function choose(v){if(answered)return;answered=true;let w=questions[index],c=correct(w),ok=normalize(v)===normalize(c);if(ok)score++;else misses.push(w);document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.textContent===c)b.classList.add('right');else if(b.textContent===v)b.classList.add('wrong')});let input=document.getElementById('writeInput');if(input){input.disabled=true;document.getElementById('check').disabled=true;input.style.background=ok?'#d7f6d9':'#ffe0d9'}let fb=document.getElementById('feedback');fb.className='feedback '+(ok?'ok':'bad');fb.innerHTML=`<b>${ok?'✅ Rätt!':'❌ Inte riktigt.'}</b> ${levels[current].kind==='gender'?`<b>${esc(w[0])}</b> är ${c.toLowerCase()}. ${w[0].endsWith('o')?'Ordet slutar på -o, vilket ofta visar maskulinum.':w[0].endsWith('a')?'Ordet slutar på -a, vilket ofta visar femininum.':'Lär dig ordets genus tillsammans med artikeln.'}`:`Rätt svar är <b>${esc(c)} ${esc(w[0])}</b>. ${ruleFor(w)}`}`;document.getElementById('next').style.display='inline-block'}
function nextQuestion(){index++;answered=false;if(index<questions.length){renderQuestion();return}if(phase==='practice'){phase='ready'}else{phase='result';if(score===5){wins[current]=(wins[current]||0)+1;if(!done.includes(current))done.push(current);unlocked=Math.max(unlocked,Math.min(TOTAL-1,current+1));persist()}}render();window.scrollTo({top:0,behavior:'smooth'})}
function advance(){openLevel(Math.min(TOTAL-1,current+1))}render();
</script></body></html>

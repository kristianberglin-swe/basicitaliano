<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Italienska – Bestämd artikel</title><style>
:root{font-family:Georgia,serif;color:#f5eddd;background:#111a25}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#233b37,#111a25 55%);min-height:100vh}main{max-width:900px;margin:auto;padding:24px 16px 70px}header{border-bottom:4px solid transparent;border-image:linear-gradient(90deg,#168b4d 33%,#f4efe5 33% 66%,#c63e35 66%) 1;padding-bottom:18px}h1{font-size:clamp(2rem,6vw,3.5rem);margin:8px 0;color:#f3cf8e}p{line-height:1.55}.muted{color:#b8c7d1}.panel{background:#1c2938;border:1px solid #48566a;border-radius:16px;padding:clamp(18px,4vw,32px);margin-top:20px;box-shadow:0 15px 40px #0004}.steps{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}.step{border:1px solid #576477;background:#253246;color:#c8d0d9;border-radius:9px;padding:9px 12px;font-size:.85rem}.step.active{background:#b68b52;color:#16120e;font-weight:bold}.step.done{border-color:#60bd88;color:#9be1b7}h2{color:#f3d18e;margin-top:0}.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:18px 0}.rule{background:#f6f4ed;color:#20242a;padding:17px;border-radius:10px}.rule strong{font-size:2rem;color:#9a5c22}.rule small{display:block;margin-top:7px;color:#48515b}.example{font-style:italic;margin-top:9px}.btn{cursor:pointer;border:1px solid #e9c38d;background:linear-gradient(#e0b778,#b58749);color:#19120a;border-radius:10px;padding:13px 18px;font-weight:bold;font-family:inherit;font-size:1rem}.btn.secondary{background:#26374b;color:#f4ecdd;border-color:#7a8799}.btn:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.question{font-size:clamp(2rem,6vw,3.3rem);font-weight:bold;text-align:center;margin:22px 0 5px}.translation{text-align:center;color:#b9c9d6}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:25px auto;max-width:560px}.choice{background:#283b50;border:2px solid #5a6a7b;border-radius:12px;padding:18px;color:white;font-size:1.55rem;font-weight:bold;cursor:pointer}.choice:hover:not(:disabled){border-color:#f3cd88}.choice.correct{background:#18553c;border-color:#7de0a4}.choice.wrong{background:#6c2a2a;border-color:#f6a5a5}.feedback{min-height:65px;text-align:center;font-size:1.15rem;line-height:1.5}.feedback.good{color:#9be8b4}.feedback.bad{color:#ffc0b9}.progress{height:9px;background:#0e1723;border-radius:20px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#168b4d,#f2e7cf,#c63e35);transition:width .25s}.small{font-size:.9rem;color:#b8c7d1}.hidden{display:none}.summary{font-size:1.2rem}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-family:system-ui,sans-serif;font-size:.9rem}td,th{padding:12px;border-bottom:1px solid #526073;text-align:left}th{color:#f0d19a}@media(max-width:500px){.choices{gap:8px}.choice{padding:13px}.step{font-size:.73rem;padding:7px}}
</style></head><body><main><header><div class="small">ITALIENSKA • TRÄNA STEG FÖR STEG</div><h1>Bestämd artikel</h1><p>Lär dig <b>il, la, l’, lo, i, le och gli</b> – en regel i taget. Först förklaring, sedan övning. Nästa steg låses upp när du klarar det förra.</p></header><nav class="steps" id="steps"></nav><section class="panel" id="content"></section></main><script>
const groups=[
{title:'Il och la',intro:'Vi börjar med vanliga ord i singular (ental). Maskulina ord använder <b>il</b> och feminina ord använder <b>la</b> framför konsonant.',rules:[['il','Maskulinum + vanlig konsonant','il ragazzo – pojken'],['la','Femininum + konsonant','la casa – huset']],types:['il','la']},
{title:'L’ framför vokal',intro:'När ett ord i singular börjar på en <b>vokal (a, e, i, o, u)</b> används <b>l’</b> för både maskulina och feminina ord. Apostrofen sitter ihop med ordet.',rules:[["l’",'Maskulinum + vokal',"l’amico – vännen"],["l’",'Femininum + vokal',"l’amica – väninnan"]],types:['il','la','lm','lf']},
{title:'Lo – specialregel',intro:'Maskulina ord som börjar med <b>s + konsonant</b> eller <b>z, x, y</b> (och vissa andra konsonantkombinationer som gn och ps) får <b>lo</b> i singular.',rules:[['lo','Maskulinum + s + konsonant','lo studente – studenten'],['lo','Maskulinum + z','lo zaino – ryggsäcken']],types:['il','la','lm','lf','lo']},
{title:'Plural: i och le',intro:'Nu går vi till <b>plural (flertal)</b>. Vanliga maskulina ord får <b>i</b> och feminina ord får <b>le</b>. Även feminina ord som börjar på vokal får <b>le</b> i plural.',rules:[['i','Maskulinum + vanlig konsonant','i ragazzi – pojkarna'],['le','Femininum, även framför vokal','le case – husen; le amiche – väninnorna']],types:['il','la','lm','lf','lo','i','le']},
{title:'Gli – plural',intro:'Maskulina ord som har <b>lo</b> eller <b>l’</b> i singular får <b>gli</b> i plural. Nu kan du alla varianter!',rules:[['gli','Plural till lo','gli studenti – studenterna'],['gli','Plural till maskulint l’','gli amici – vännerna']],types:['il','la','lm','lf','lo','i','le','gli']},
{title:'Blandad slutträning',intro:'Nu blandas <b>alla bestämda artiklar</b>. Du behöver avgöra genus, singular/plural och hur ordet börjar. Klara minst 8 av 10 för att bemästra hela området.',rules:[],types:['il','la','lm','lf','lo','i','le','gli']}
];
const bank=[
['ragazzo','pojke','il'],['libro','bok','il'],['cane','hund','il'],['tavolo','bord','il'],['gatto','katt','il'],['fiore','blomma','il'],['professore','lärare (man)','il'],
['casa','hus','la'],['scuola','skola','la'],['ragazza','flicka','la'],['penna','penna','la'],['macchina','bil','la'],['notte','natt','la'],['sedia','stol','la'],
['amico','vän','lm'],['albero','träd','lm'],['orologio','klocka','lm'],['uomo','man','lm'],['elefante','elefant','lm'],
['amica','väninna','lf'],['isola','ö','lf'],['arancia','apelsin','lf'],['ora','timme','lf'],['estate','sommar','lf'],
['studente','student','lo'],['zaino','ryggsäck','lo'],['sport','sport','lo'],['specchio','spegel','lo'],['zio','morbror/farbror','lo'],['psicologo','psykolog','lo'],
['ragazzi','pojkar','i'],['libri','böcker','i'],['cani','hundar','i'],['gatti','katter','i'],['tavoli','bord','i'],['fiori','blommor','i'],
['case','hus','le'],['ragazze','flickor','le'],['scuole','skolor','le'],['amiche','väninnor','le'],['isole','öar','le'],['penne','pennor','le'],
['studenti','studenter','gli'],['zaini','ryggsäckar','gli'],['amici','vänner','gli'],['alberi','träd','gli'],['zii','morbröder/farbröder','gli'],['specchi','speglar','gli']
];
const article=t=>({lm:"l’",lf:"l’"}[t]||t);const reasons={il:'Maskulint singular framför vanlig konsonant.',la:'Feminint singular framför konsonant.',lm:'Maskulint singular framför vokal.',lf:'Feminint singular framför vokal.',lo:'Maskulint singular framför s + konsonant eller särskild begynnelse.',i:'Maskulint plural till il.',le:'Feminint plural (även framför vokal).',gli:'Maskulint plural till lo eller l’.'};
let unlocked=Number(localStorage.getItem('artikelUnlocked')||0);unlocked=Math.min(Math.max(unlocked,0),5);let stage=unlocked,mode='intro',questions=[],idx=0,correct=0,answered=false,missed=[];const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function nav(){ $('steps').innerHTML=groups.map((g,i)=>`<button class="step ${i===stage?'active':''} ${i<unlocked?'done':''}" ${i>unlocked?'disabled':''} data-stage="${i}">${i<unlocked?'✓ ':''}${i+1}. ${g.title}</button>`).join('');document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=+b.dataset.stage;mode='intro';render()})}function render(){nav();const g=groups[stage];if(mode==='intro'){$('content').innerHTML=`<div class="small">STEG ${stage+1} AV 6 · FÖRKLARING</div><h2>${g.title}</h2><p>${g.intro}</p>${g.rules.length?`<div class="rules">${g.rules.map(r=>`<div class="rule"><strong>${r[0]}</strong><div>${r[1]}</div><div class="example">${r[2]}</div></div>`).join('')}</div>`:''}<div class="actions"><button class="btn" id="start">${stage===5?'Starta slutträningen':'Jag förstår – börja öva'}</button></div>`;$('start').onclick=start;return}if(mode==='quiz')return drawQuestion();if(mode==='end')return drawEnd()}
function start(){let g=groups[stage],pool=bank.filter(w=>g.types.includes(w[2]));if(stage<5){let fresh=bank.filter(w=>g.types.includes(w[2])&&(stage===0||!groups[stage-1].types.includes(w[2])));let old=pool.filter(w=>!fresh.includes(w));questions=shuffle([...shuffle(fresh).slice(0,Math.min(5,fresh.length)),...shuffle(old).slice(0,5)]);while(questions.length<8)questions.push(...shuffle(pool).slice(0,8-questions.length));questions=shuffle(questions).slice(0,10)}else questions=shuffle(pool).slice(0,10);idx=0;correct=0;missed=[];mode='quiz';render()}
function drawQuestion(){if(idx>=questions.length){mode='end';return render()}answered=false;let w=questions[idx],right=article(w[2]),available=[...new Set(groups[stage].types.map(article))],options=shuffle([...new Set([right,...shuffle(available.filter(a=>a!==right)).slice(0,3)])]);while(options.length<Math.min(4,available.length)){options.push(available.find(a=>!options.includes(a)))}$('content').innerHTML=`<div class="small">STEG ${stage+1} · FRÅGA ${idx+1} AV ${questions.length} · ${correct} RÄTT</div><div class="progress"><div class="bar" style="width:${idx/questions.length*100}%"></div></div><div class="question">___ ${w[0]}</div><div class="translation">${w[1]} · välj rätt bestämd artikel</div><div class="choices">${options.map(a=>`<button class="choice" data-answer="${a}">${a}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions" style="justify-content:center"><button class="btn hidden" id="next">${idx===questions.length-1?'Visa resultat':'Nästa fråga →'}</button><button class="btn secondary" id="rules">Visa förklaring</button></div><div id="help" class="hidden small" style="margin-top:15px">${groups[stage].intro}</div>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b,w));$('next').onclick=()=>{idx++;render()};$('rules').onclick=()=>{$('help').classList.toggle('hidden')}}
function answer(button,w){if(answered)return;answered=true;let right=article(w[2]),ok=button.dataset.answer===right;if(ok)correct++;else missed.push(w);document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(b.dataset.answer===right)b.classList.add('correct');else if(b===button)b.classList.add('wrong')});$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').innerHTML=`<b>${ok?'✓ Rätt!':'✗ Inte riktigt.'}</b><div>${right} ${w[0]} – ${reasons[w[2]]}</div>`;$('next').classList.remove('hidden')}
function drawEnd(){let pass=correct>=8; if(pass&&stage>=unlocked&&stage<5){unlocked=stage+1;localStorage.setItem('artikelUnlocked',unlocked)}nav();$('content').innerHTML=`<div class="small">STEG ${stage+1} · RESULTAT</div><h2>${pass?'Bravissimo! 🎉':'Bra kämpat – öva lite till!'}</h2><p class="summary">Du fick <b>${correct} av ${questions.length} rätt</b>. ${pass?'Du har klarat steget!':'Du behöver minst 8 av 10 rätt för att gå vidare.'}</p>${missed.length?`<p>Repetera gärna:</p><div class="tablewrap"><table><tr><th>Ord</th><th>Rätt artikel</th><th>Varför?</th></tr>${missed.map(w=>`<tr><td>${w[0]}</td><td><b>${article(w[2])}</b></td><td>${reasons[w[2]]}</td></tr>`).join('')}</table></div>`:''}<div class="actions"><button class="btn secondary" id="retry">Öva igen</button>${pass&&stage<5?'<button class="btn" id="advance">Gå vidare? →</button>':''}${pass&&stage===5?'<button class="btn" id="again">Ny blandad träning</button>':''}<button class="btn secondary" id="review">Läs reglerna igen</button></div>`;$('retry').onclick=start;$('review').onclick=()=>{mode='intro';render()};if($('advance'))$('advance').onclick=()=>{stage++;mode='intro';render()};if($('again'))$('again').onclick=start}
render();
</script></body></html>
